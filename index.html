<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAML - Desert Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Language Switcher -->
        <div class="header-controls">
            <div class="lang-selector">
                <select id="lang-select" onchange="changeLanguage(this.value)">
                    <option value="en" selected>English</option>
                    <option value="ar">العربية</option>
                    <option value="fr">Français</option>
                </select>
            </div>
        </div>

        <h1 id="title-text">RAML</h1>

        <!-- Mode Selection -->
        <div class="mode-selection">
            <button class="mode-btn active" onclick="setMode(2)" id="mode-2-btn">2 Players</button>
            <button class="mode-btn" onclick="setMode(3)" id="mode-3-btn">3 Players</button>
            <button class="mode-btn" onclick="setMode(4)" id="mode-4-btn">4 Players</button>
        </div>

        <!-- Match Info & Tournament Status -->
        <div id="tournament-info" class="tournament-info"></div>
        <p id="game-status">Player 1's Turn (White)</p>

        <!-- Larger Board -->
        <div class="board" id="board">
            <svg class="board-lines" viewBox="0 0 340 340">
                <line x1="35" y1="35" x2="305" y2="35" stroke="#4a3319" stroke-width="5"/>
                <line x1="35" y1="170" x2="305" y2="170" stroke="#4a3319" stroke-width="5"/>
                <line x1="35" y1="305" x2="305" y2="305" stroke="#4a3319" stroke-width="5"/>
                <line x1="35" y1="35" x2="35" y2="305" stroke="#4a3319" stroke-width="5"/>
                <line x1="170" y1="35" x2="170" y2="305" stroke="#4a3319" stroke-width="5"/>
                <line x1="305" y1="35" x2="305" y2="305" stroke="#4a3319" stroke-width="5"/>
                <line x1="35" y1="35" x2="305" y2="305" stroke="#4a3319" stroke-width="5"/>
                <line x1="305" y1="35" x2="35" y2="305" stroke="#4a3319" stroke-width="5"/>
            </svg>
            <!-- 9 Intersection Points -->
            <div class="point" data-index="0" style="top: 35px; left: 35px;" onclick="handlePointClick(0)"></div>
            <div class="point" data-index="1" style="top: 35px; left: 170px;" onclick="handlePointClick(1)"></div>
            <div class="point" data-index="2" style="top: 35px; left: 305px;" onclick="handlePointClick(2)"></div>
            <div class="point" data-index="3" style="top: 170px; left: 35px;" onclick="handlePointClick(3)"></div>
            <div class="point" data-index="4" style="top: 170px; left: 170px;" onclick="handlePointClick(4)"></div>
            <div class="point" data-index="5" style="top: 170px; left: 305px;" onclick="handlePointClick(5)"></div>
            <div class="point" data-index="6" style="top: 305px; left: 35px;" onclick="handlePointClick(6)"></div>
            <div class="point" data-index="7" style="top: 305px; left: 170px;" onclick="handlePointClick(7)"></div>
            <div class="point" data-index="8" style="top: 305px; left: 305px;" onclick="handlePointClick(8)"></div>
        </div>

        <button id="reset-btn" onclick="resetFullGame()">Reset Game</button>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="modal">
        <div class="modal-content">
            <div class="trophy-icon">🏆</div>
            <h2 id="winner-text">Congratulations!</h2>
            <p id="winner-subtext">Match finished successfully.</p>
            <button id="modal-next-btn" onclick="nextTournamentStep()">Next Match</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
