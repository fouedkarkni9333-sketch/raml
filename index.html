<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAML - Split Screen Desert Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Header Controls -->
        <div class="header-controls">
            <div class="lang-selector">
                <select id="lang-select" onchange="changeLanguage(this.value)">
                    <option value="en" selected>English</option>
                    <option value="ar">العربية</option>
                    <option value="fr">Français</option>
                </select>
            </div>
        </div>

        <h1 id="title-text">RAML</h1>

        <!-- Mode Selection -->
        <div class="mode-selection">
            <button class="mode-btn active" onclick="setMode(2)" id="mode-2-btn">2 Players</button>
            <button class="mode-btn" onclick="setMode(3)" id="mode-3-btn">3 Players</button>
            <button class="mode-btn" onclick="setMode(4)" id="mode-4-btn">4 Players</button>
        </div>

        <!-- Global Status / Info -->
        <div id="tournament-info" class="tournament-info"></div>

        <!-- Boards Wrapper (Supports Single or Split Screen) -->
        <div id="boards-wrapper" class="boards-wrapper single-board-mode">
            
            <!-- BOARD 1 -->
            <div class="board-pane" id="pane-1">
                <p id="game-status-1" class="pane-status">Player 1 : Turn (White)</p>
                <div class="board" id="board-1">
                    <svg class="board-lines" viewBox="0 0 340 340">
                        <line x1="35" y1="35" x2="305" y2="35" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="35" y1="170" x2="305" y2="170" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="35" y1="305" x2="305" y2="305" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="35" y1="35" x2="35" y2="305" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="170" y1="35" x2="170" y2="305" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="305" y1="35" x2="305" y2="305" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="35" y1="35" x2="305" y2="305" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="305" y1="35" x2="35" y2="305" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                    </svg>
                    <div class="point" data-board="1" data-index="0" style="top: 10.3%; left: 10.3%;" onclick="handlePointClick(1, 0)"></div>
                    <div class="point" data-board="1" data-index="1" style="top: 10.3%; left: 50%;" onclick="handlePointClick(1, 1)"></div>
                    <div class="point" data-board="1" data-index="2" style="top: 10.3%; left: 89.7%;" onclick="handlePointClick(1, 2)"></div>
                    <div class="point" data-board="1" data-index="3" style="top: 50%; left: 10.3%;" onclick="handlePointClick(1, 3)"></div>
                    <div class="point" data-board="1" data-index="4" style="top: 50%; left: 50%;" onclick="handlePointClick(1, 4)"></div>
                    <div class="point" data-board="1" data-index="5" style="top: 50%; left: 89.7%;" onclick="handlePointClick(1, 5)"></div>
                    <div class="point" data-board="1" data-index="6" style="top: 89.7%; left: 10.3%;" onclick="handlePointClick(1, 6)"></div>
                    <div class="point" data-board="1" data-index="7" style="top: 89.7%; left: 50%;" onclick="handlePointClick(1, 7)"></div>
                    <div class="point" data-board="1" data-index="8" style="top: 89.7%; left: 89.7%;" onclick="handlePointClick(1, 8)"></div>
                </div>
            </div>

            <!-- BOARD 2 (For Split Screen Mode) -->
            <div class="board-pane" id="pane-2" style="display: none;">
                <p id="game-status-2" class="pane-status">Player 3 : Turn (White)</p>
                <div class="board" id="board-2">
                    <svg class="board-lines" viewBox="0 0 340 340">
                        <line x1="35" y1="35" x2="305" y2="35" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="35" y1="170" x2="305" y2="170" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="35" y1="305" x2="305" y2="305" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="35" y1="35" x2="35" y2="305" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="170" y1="35" x2="170" y2="305" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="305" y1="35" x2="305" y2="305" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="35" y1="35" x2="305" y2="305" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                        <line x1="305" y1="35" x2="35" y2="305" stroke="#d4af37" stroke-opacity="0.5" stroke-width="5"/>
                    </svg>
                    <div class="point" data-board="2" data-index="0" style="top: 10.3%; left: 10.3%;" onclick="handlePointClick(2, 0)"></div>
                    <div class="point" data-board="2" data-index="1" style="top: 10.3%; left: 50%;" onclick="handlePointClick(2, 1)"></div>
                    <div class="point" data-board="2" data-index="2" style="top: 10.3%; left: 89.7%;" onclick="handlePointClick(2, 2)"></div>
                    <div class="point" data-board="2" data-index="3" style="top: 50%; left: 10.3%;" onclick="handlePointClick(2, 3)"></div>
                    <div class="point" data-board="2" data-index="4" style="top: 50%; left: 50%;" onclick="handlePointClick(2, 4)"></div>
                    <div class="point" data-board="2" data-index="5" style="top: 50%; left: 89.7%;" onclick="handlePointClick(2, 5)"></div>
                    <div class="point" data-board="2" data-index="6" style="top: 89.7%; left: 10.3%;" onclick="handlePointClick(2, 6)"></div>
                    <div class="point" data-board="2" data-index="7" style="top: 89.7%; left: 50%;" onclick="handlePointClick(2, 7)"></div>
                    <div class="point" data-board="2" data-index="8" style="top: 89.7%; left: 89.7%;" onclick="handlePointClick(2, 8)"></div>
                </div>
            </div>

        </div>

        <button id="reset-btn" onclick="resetFullGame()">Reset Game</button>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="modal">
        <div class="modal-content">
            <div class="trophy-icon">🏆</div>
            <h2 id="winner-text">Congratulations!</h2>
            <p id="winner-subtext">Match finished successfully.</p>
            <button id="modal-next-btn" onclick="nextTournamentStep()">Next Match / Final</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
